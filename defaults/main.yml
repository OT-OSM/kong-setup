kong_version: "3.9.0"
kong_download_path: "/tmp/kong.deb"

kong_service_name: my-service
kong_upstream_url: "https://httpbin.org"
kong_route_path: "/test"

# PostgreSQL
pg_host: "127.0.0.1"
pg_port: 5432
pg_user: kong
pg_password: kong
pg_database: kong

# Kong config path (IMPORTANT FIX)
kong_conf_dir: "/etc/kong"

# Kong Admin API (use IP-safe access instead of localhost)
kong_admin_url: "http://{{ ansible_host }}:8001"

# Plugin config defaults
kong_rate_limit_per_minute: 100

# Optional but useful for stability
kong_admin_timeout: 60
kong_wait_retries: 60
kong_wait_delay: 5
