---
# =====================================================
# KONG HANDLERS (SYSTEMD-BASED - PRODUCTION SAFE)
# =====================================================

- name: restart kong
  systemd:
    name: kong
    state: restarted
    daemon_reload: yes
  listen: restart kong

- name: reload kong
  systemd:
    name: kong
    state: reloaded
  listen: reload kong

- name: reload systemd
  systemd:
    daemon_reload: yes
