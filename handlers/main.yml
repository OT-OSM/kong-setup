---
# =====================================================
# KONG HANDLERS (SYSTEMD-BASED - PRODUCTION SAFE)
# =====================================================

- name: restart kong
  ansible.builtin.systemd:
    name: kong
    state: restarted
    daemon_reload: true
  listen: restart kong

# NOTE:
# Kong does NOT properly support systemd "reload" in most setups.
# So we map reload → restart for safety.

- name: reload kong
  ansible.builtin.systemd:
    name: kong
    state: restarted
    daemon_reload: true
  listen: reload kong

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
