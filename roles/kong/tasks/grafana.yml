- name: Install required dependencies
  apt:
    name:
      - software-properties-common
      - apt-transport-https
      - wget
    state: present
    update_cache: yes

- name: Add Grafana GPG key
  apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present

- name: Add Grafana repository
  apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  apt:
    name: grafana
    state: present
    update_cache: yes

- name: Enable Grafana
  systemd:
    name: grafana-server
    enabled: yes
    state: started

- name: Configure Prometheus datasource
  copy:
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:9090
          isDefault: true

- name: Restart Grafana
  systemd:
    name: grafana-server
    state: restarted
