---
# =====================================================
# POSTGRESQL HEALTH CHECK (CLOUD-READY + SAFE)
# =====================================================

- name: PostgreSQL port reachability check
  ansible.builtin.shell: >
    pg_isready -h {{ kong_pg_host }} -p {{ kong_pg_port }}
  register: pg_ready
  retries: 10
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

# =====================================================
# POSTGRES AUTHENTICATION TEST
# =====================================================

- name: PostgreSQL authentication test
  ansible.builtin.shell: |
    PGPASSWORD={{ kong_pg_password }} psql \
    -h {{ kong_pg_host }} \
    -U {{ kong_pg_user }} \
    -d postgres \
    -c "SELECT 1;"
  register: pg_test
  retries: 5
  delay: 3
  until: pg_test.rc == 0
  changed_when: false

# =====================================================
# FINAL STATUS OUTPUT
# =====================================================

- name: Show PostgreSQL connectivity status
  ansible.builtin.debug:
    msg: "PostgreSQL is reachable and responding"
