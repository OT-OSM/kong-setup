---
# =====================================================
# KONG SERVICE MANAGEMENT (PRODUCTION SAFE)
# =====================================================

- name: Validate Kong config
  ansible.builtin.command: kong check /etc/kong/kong.conf
  changed_when: false

# =====================================================
# STOP KONG (SAFE)
# =====================================================

- name: Stop Kong safely
  ansible.builtin.systemd:
    name: kong
    state: stopped
  failed_when: false

# =====================================================
# POSTGRES MIGRATION BLOCK
# =====================================================

- block:

    - name: Wait for PostgreSQL stable connection
      ansible.builtin.shell: |
        PGPASSWORD={{ pg_password }} psql \
        -h {{ pg_host }} \
        -U {{ pg_user }} \
        -d postgres \
        -c "SELECT 1;"
      register: db_ping
      retries: 20
      delay: 3
      until: db_ping.rc == 0
      changed_when: false

    - name: Check Kong schema existence
      ansible.builtin.shell: |
        PGPASSWORD={{ pg_password }} psql \
        -h {{ pg_host }} \
        -U {{ pg_user }} \
        -d {{ pg_database }} \
        -c "\dt"
      register: schema_check
      changed_when: false
      failed_when: false

    - name: Run migrations bootstrap (first time only)
      ansible.builtin.command: >
        kong migrations bootstrap -c /etc/kong/kong.conf
      when: "'kong' not in schema_check.stdout"

    - name: Run migrations up
      ansible.builtin.command: >
        kong migrations up -c /etc/kong/kong.conf

    - name: Run migrations finish
      ansible.builtin.command: >
        kong migrations finish -c /etc/kong/kong.conf

  when: (kong_mode | default('postgres') | trim | lower) == "postgres"

# =====================================================
# START KONG
# =====================================================

- name: Start Kong
  ansible.builtin.systemd:
    name: kong
    state: started
    enabled: true

# =====================================================
# WAIT FOR KONG READINESS (IMPORTANT FIX)
# =====================================================

- name: Wait for Kong Admin API to be ready
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/status"
    method: GET
    status_code: 200
  register: kong_status
  retries: 60
  delay: 5
  until: kong_status.status == 200

# =====================================================
# WAIT FOR FULL DATABASE READINESS
# =====================================================

- name: Wait for Kong DB to be ready
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/status"
    method: GET
    status_code: 200
  register: kong_db_ready
  retries: 40
  delay: 5
  until: kong_db_ready.json.database.state == "ready"
