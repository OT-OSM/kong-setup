---
# =====================================================
# KONG SERVICE MANAGEMENT (DBLESS + POSTGRES SAFE)
# =====================================================

- name: Validate Kong config
  ansible.builtin.command: kong check /etc/kong/kong.conf
  changed_when: false

- name: Stop Kong safely
  ansible.builtin.systemd:
    name: kong
    state: stopped
  failed_when: false

# =====================================================
# POSTGRES MODE BLOCK
# =====================================================

- block:

    - name: Wait for PostgreSQL stable connection
      ansible.builtin.shell: |
        PGPASSWORD={{ pg_password }} psql \
        -h {{ pg_host }} \
        -U {{ pg_user }} \
        -d postgres \
        -c "SELECT 1;"
      register: db_ping
      retries: 20
      delay: 3
      until: db_ping.rc == 0
      changed_when: false

    - name: Check Kong schema existence
      ansible.builtin.shell: |
        PGPASSWORD={{ pg_password }} psql \
        -h {{ pg_host }} \
        -U {{ pg_user }} \
        -d {{ pg_database }} \
        -c "\dt"
      register: schema_check
      changed_when: false
      failed_when: false

    - name: Run migrations bootstrap (first time only)
      ansible.builtin.command: >
        kong migrations bootstrap -c {{ kong_conf_dir }}/kong.conf
      when: "'kong' not in schema_check.stdout"

    - name: Run migrations up
      ansible.builtin.command: >
        kong migrations up -c {{ kong_conf_dir }}/kong.conf

    - name: Run migrations finish
      ansible.builtin.command: >
        kong migrations finish -c {{ kong_conf_dir }}/kong.conf

  when: (kong_mode | default('postgres') | trim | lower) == "postgres"

# =====================================================
# START KONG (COMMON FOR BOTH MODES)
# =====================================================

- name: Start Kong
  ansible.builtin.systemd:
    name: kong
    state: started
    enabled: true

- name: Wait for Kong Admin API to be ready
  ansible.builtin.uri:
    url: http://{{ ansible_host }}:8001/status
    method: GET
    status_code: [200, 204]
  register: kong_status
  retries: 60
  delay: 5
  until: kong_status.status in [200, 204]
