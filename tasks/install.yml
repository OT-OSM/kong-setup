---
# =====================================================
# KONG INSTALLATION (SAFE + IDEMPOTENT)
# =====================================================

- name: Download Kong package
  ansible.builtin.get_url:
    url: >-
      https://packages.konghq.com/public/gateway-39/deb/ubuntu/pool/noble/main/k/ko/kong_{{ kong_version }}/kong_{{ kong_version }}_amd64.deb
    dest: "{{ kong_download_path | default('/tmp/kong.deb') }}"
    mode: '0644'
    force: true
    timeout: 60
  register: kong_download

# =====================================================
# INSTALL PACKAGE
# =====================================================

- name: Install Kong package
  ansible.builtin.apt:
    deb: "{{ kong_download_path | default('/tmp/kong.deb') }}"
    state: present

# =====================================================
# HOLD VERSION (PREVENT AUTO UPGRADE)
# =====================================================

- name: Hold Kong package version
  ansible.builtin.dpkg_selections:
    name: kong
    selection: hold
