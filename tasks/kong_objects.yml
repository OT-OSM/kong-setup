---
# =====================================================
# WAIT FOR KONG ADMIN API
# =====================================================

- name: Wait for Kong Admin API port 8001
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 8001
    delay: 5
    timeout: 120

- name: Wait for Kong Admin API readiness
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/status"
    method: GET
    status_code: 200
  register: kong_status
  retries: 60
  delay: 5
  until: kong_status.status == 200
  changed_when: false

# =====================================================
# CREATE SERVICE
# =====================================================

- name: Create Service
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/services"
    method: POST
    body:
      name: "{{ kong_service_name }}"
      url: "{{ kong_upstream_url }}"
    body_format: json
    status_code: [201, 409]
  register: service_result
  retries: 5
  delay: 2
  until: service_result.status in [201, 409]

# =====================================================
# CREATE ROUTE
# =====================================================

- name: Create Route
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/services/{{ kong_service_name }}/routes"
    method: POST
    body:
      paths:
        - "{{ kong_route_path }}"
    body_format: json
    status_code: [201, 409]
  register: route_result
  retries: 5
  delay: 2
  until: route_result.status in [201, 409]

# =====================================================
# KEY AUTH PLUGIN
# =====================================================

- name: Enable Key Auth Plugin
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/services/{{ kong_service_name }}/plugins"
    method: POST
    body:
      name: key-auth
    body_format: json
    status_code: [201, 409]
  register: keyauth_result
  retries: 5
  delay: 2
  until: keyauth_result.status in [201, 409]

# =====================================================
# JWT PLUGIN
# =====================================================

- name: Enable JWT Plugin
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/services/{{ kong_service_name }}/plugins"
    method: POST
    body:
      name: jwt
    body_format: json
    status_code: [201, 409]
  register: jwt_result
  retries: 5
  delay: 2
  until: jwt_result.status in [201, 409]

# =====================================================
# RATE LIMITING PLUGIN
# =====================================================

- name: Enable Rate Limiting Plugin
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/services/{{ kong_service_name }}/plugins"
    method: POST
    body:
      name: rate-limiting
      config:
        minute: 100
        policy: local
    body_format: json
    status_code: [201, 409]
  register: rl_result
  retries: 5
  delay: 2
  until: rl_result.status in [201, 409]

# =====================================================
# PROMETHEUS (GLOBAL)
# =====================================================

- name: Enable Prometheus Plugin (global)
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8001/plugins"
    method: POST
    body:
      name: prometheus
    body_format: json
    status_code: [201, 409]
  register: prom_result
  retries: 5
  delay: 2
  until: prom_result.status in [201, 409]
