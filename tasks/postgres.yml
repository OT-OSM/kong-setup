---
# =====================================================
# PostgreSQL setup for Kong (ONLY when kong_mode=postgres)
# =====================================================

- name: Install PostgreSQL packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: yes

- name: Start and enable PostgreSQL service
  service:
    name: postgresql
    state: started
    enabled: yes

# -------------------------------
# WAIT FOR POSTGRESQL
# -------------------------------

- name: Wait for PostgreSQL TCP port
  wait_for:
    host: "{{ kong_pg_host | default('127.0.0.1') }}"
    port: "{{ kong_pg_port | default(5432) }}"
    timeout: 120

- name: Wait for PostgreSQL fully ready
  shell: pg_isready -h {{ kong_pg_host | default('127.0.0.1') }} -p {{ kong_pg_port | default(5432) }}
  register: pg_ready
  retries: 30
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

# -------------------------------
# CONFIGURE POSTGRESQL (LISTEN ADDRESS)
# -------------------------------

- name: Find PostgreSQL config file
  find:
    paths: /etc/postgresql
    patterns: postgresql.conf
    recurse: yes
  register: pg_conf

- name: Set PostgreSQL listen address to localhost
  lineinfile:
    path: "{{ pg_conf.files[0].path }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '127.0.0.1'"
  notify: restart postgresql
  when: pg_conf.matched > 0

# -------------------------------
# CREATE KONG DB USER
# -------------------------------

- name: Create Kong database user (idempotent)
  become: true
  become_user: postgres
  shell: |
    psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ kong_pg_user }}'" | grep -q 1 || \
    psql -c "CREATE USER {{ kong_pg_user }} WITH PASSWORD '{{ kong_pg_password }}';"
  args:
    executable: /bin/bash

# -------------------------------
# CREATE KONG DATABASE
# -------------------------------

- name: Create Kong database (idempotent)
  become: true
  become_user: postgres
  shell: |
    psql -lqt | cut -d \| -f 1 | grep -qw {{ kong_pg_database }} || \
    psql -c "CREATE DATABASE {{ kong_pg_database }} OWNER {{ kong_pg_user }};"
  args:
    executable: /bin/bash
