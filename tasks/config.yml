---
# =====================================================
# KONG CONFIG DEPLOYMENT (DBLESS + POSTGRES SAFE)
# =====================================================

- name: Create Kong config directory
  ansible.builtin.file:
    path: "{{ kong_conf_dir }}"
    state: directory
    owner: "{{ kong_user }}"
    group: "{{ kong_group }}"
    mode: '0755'

# =====================================================
# DEPLOY MAIN KONG CONFIG
# =====================================================

- name: Deploy kong.conf
  ansible.builtin.template:
    src: kong.conf.j2
    dest: "{{ kong_conf_dir }}/kong.conf"
    owner: "{{ kong_user }}"
    group: "{{ kong_group }}"
    mode: '0644'
  notify: restart kong

# =====================================================
# DEPLOY DBLESS DECLARATIVE CONFIG
# =====================================================

- name: Deploy kong.yml (dbless mode only)
  ansible.builtin.template:
    src: kong.yml.j2
    dest: "{{ kong_conf_dir }}/kong.yml"
    owner: "{{ kong_user }}"
    group: "{{ kong_group }}"
    mode: '0644'
  when: (kong_mode | default('postgres') | trim | lower) == "dbless"
  notify: reload kong

# =====================================================
# DEPLOY SYSTEMD SERVICE
# =====================================================

- name: Deploy Kong systemd service
  ansible.builtin.template:
    src: kong.service.j2
    dest: /etc/systemd/system/kong.service
    mode: '0644'
  notify:
    - reload systemd
    - restart kong

# =====================================================
# RELOAD SYSTEMD
# =====================================================

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
