- name: Install Prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: yes

- name: Configure Prometheus
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: kong
          static_configs:
            - targets:
                - kong-1:8001
                - kong-2:8001
                - kong-3:8001

- name: Restart Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
